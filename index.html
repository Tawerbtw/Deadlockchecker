<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Deadlock Players</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            margin: 0;
            padding: 25px;
        }

        h1 {
            margin: 0 0 25px 0;
        }

        /* Сетка игроков */
        #players {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));

            gap: 15px;

            width: 100%;
        }

        /* Карточка игрока */
        .player {
            background: #1d1d1d;

            border-radius: 10px;

            padding: 18px;

            min-height: 150px;

            transition: transform 0.15s;
        }

        .player:hover {
            transform: translateY(-2px);
        }

        .name {
            font-size: 19px;
            font-weight: bold;
        }

        .status {
            margin-top: 6px;
            font-weight: bold;
        }

        .online {
            color: #4cff72;
        }

        .offline {
            color: #999;
        }

        .current-match {
            margin-top: 12px;

            line-height: 1.6;

            color: #ddd;
        }

        .last-match {
            margin-top: 14px;

            padding-top: 12px;

            border-top: 1px solid #333;

            line-height: 1.6;

            color: #bbb;
        }

        .last-match-title {
            color: #fff;

            font-weight: bold;

            margin-bottom: 3px;
        }

        .win {
            color: #4cff72;
        }

        .loss {
            color: #ff6666;
        }

        .loading {
            color: #aaa;
        }

    </style>
</head>


<body>

    <h1>Deadlock Players</h1>

    <div id="players">
        <div class="loading">
            Загрузка...
        </div>
    </div>


<script>


function formatDuration(seconds) {

    if (seconds === null || seconds === undefined) {
        return "—";
    }

    const minutes = Math.floor(seconds / 60);

    const secs = seconds % 60;

    return `${minutes}:${String(secs).padStart(2, "0")}`;
}


function formatDate(timestamp) {

    if (!timestamp) {
        return "—";
    }

    const date = new Date(timestamp);

    return date.toLocaleString(
        "ru-RU",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


function getResult(result) {

    if (result === 1) {
        return '<span class="win">Победа</span>';
    }

    if (result === 0) {
        return '<span class="loss">Поражение</span>';
    }

    return "—";
}


async function loadPlayers() {

    try {

        const response = await fetch(
            "/api/players?t=" + Date.now()
        );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const players = await response.json();

        const container =
            document.getElementById("players");

        container.innerHTML = "";


        players.forEach(player => {

            const div =
                document.createElement("div");

            div.className = "player";


            let currentMatch = "";


            if (player.status === "in_game") {

                currentMatch = `

                    <div class="current-match">

                        Матч:
                        ${player.match.matchId ?? "—"}

                        <br>

                        Режим:
                        ${player.match.gameMode ?? "—"}

                        <br>

                        Длительность:
                        ${formatDuration(
                            player.match.durationS
                        )}

                    </div>
                `;
            }


            let lastMatch = "";


            if (player.lastMatch) {

                const match =
                    player.lastMatch;

                lastMatch = `

                    <div class="last-match">

                        <div class="last-match-title">
                            Последний матч
                        </div>

                        Результат:
                        ${getResult(match.result)}

                        <br>

                        Сыгран:
                        ${formatDate(match.startTime)}

                    </div>
                `;
            }


            div.innerHTML = `

                <div class="name">
                    ${player.name}
                </div>

                ${
                    player.status === "in_game"

                    ?

                    `<div class="status online">
                        🟢 В игре
                    </div>`

                    :

                    `<div class="status offline">
                        ⚪ Не в игре
                    </div>`
                }

                ${currentMatch}

                ${lastMatch}

            `;


            container.appendChild(div);

        });


    } catch (error) {

        console.error(error);

        document.getElementById(
            "players"
        ).innerHTML = `
            <div class="loading">
                Ошибка загрузки данных
            </div>
        `;
    }
}


loadPlayers();

setInterval(
    loadPlayers,
    10000
);


</script>

</body>

</html>
